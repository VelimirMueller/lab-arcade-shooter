# Fleet standard ci.yml (library tier, public). Stages call VelimirMueller/fleet-workflows at v0.0.2.
name: ci

on:
  pull_request:
    branches: [develop, main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      e2e:
        description: Run the e2e stage
        type: boolean
        default: false

permissions: {}

defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.event.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ github.event_name != 'pull_request' || steps.filter.outputs.code == 'true' }}
    steps:
      - name: Detect code changes
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          # every: a file counts as code only when it matches all negated globs, that is, when it
          # is none of the docs-only paths. One such file sets code=true (CI-COST-10).
          predicate-quantifier: every
          filters: |
            code:
              - '!**/*.md'
              - '!docs/**'
              - '!LICENSE'
              - '!.github/ISSUE_TEMPLATE/**'

  lint:
    needs: changes
    if: ${{ !failure() && !cancelled() && needs.changes.outputs.code == 'true' }}
    permissions:
      contents: read
    uses: VelimirMueller/fleet-workflows/.github/workflows/_ci-lint.yml@v0.0.2
    with:
      stack: rust
      # Bevy needs the ALSA and udev headers on Linux.
      install-command: sudo apt-get update -q && sudo apt-get install -y -q libasound2-dev libudev-dev pkg-config && cargo fetch --locked
      # Default rust lint, but dead_code stays allowed as in the old CI (unused helpers kept for later stages).
      command: cargo fmt --all --check && cargo clippy --all-targets --all-features --locked -- -D warnings -A dead_code

  unit:
    needs: [changes, lint]
    if: ${{ !failure() && !cancelled() && needs.changes.outputs.code == 'true' }}
    permissions:
      contents: read
    uses: VelimirMueller/fleet-workflows/.github/workflows/_ci-unit.yml@v0.0.2
    with:
      stack: rust
      # Bevy needs the ALSA and udev headers on Linux.
      install-command: sudo apt-get update -q && sudo apt-get install -y -q libasound2-dev libudev-dev pkg-config && cargo fetch --locked
      # Today 20.1 % lines (macOS run); 18 leaves room for platform cfg differences. Only goes up.
      coverage-floor: 18

  e2e:
    needs: [changes, unit]
    if: ${{ !failure() && !cancelled() && github.event_name == 'workflow_dispatch' && inputs.e2e }}
    permissions:
      contents: read
    uses: VelimirMueller/fleet-workflows/.github/workflows/_ci-e2e.yml@v0.0.2
    with:
      stack: rust
      # Bevy needs the ALSA and udev headers on Linux.
      install-command: sudo apt-get update -q && sudo apt-get install -y -q libasound2-dev libudev-dev pkg-config && cargo fetch --locked

  build:
    needs: [changes, e2e]
    if: ${{ !failure() && !cancelled() && needs.changes.outputs.code == 'true' }}
    permissions:
      contents: read
    uses: VelimirMueller/fleet-workflows/.github/workflows/_ci-build.yml@v0.0.2
    with:
      stack: rust
      # Bevy needs the ALSA and udev headers on Linux.
      install-command: sudo apt-get update -q && sudo apt-get install -y -q libasound2-dev libudev-dev pkg-config && cargo fetch --locked
      pack: false

  conclusion:
    needs: [changes, lint, unit, e2e, build]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Fail when a job failed or a required stage was skipped
        env:
          CODE: ${{ needs.changes.outputs.code }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
          LINT: ${{ needs.lint.result }}
          UNIT: ${{ needs.unit.result }}
          BUILD: ${{ needs.build.result }}
        run: |
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) echo "::error::a job ended as $r"; exit 1 ;; esac
          done
          if [ "$CODE" = "true" ]; then
            for r in "$LINT" "$UNIT" "$BUILD"; do
              [ "$r" = "success" ] || { echo "::error::a required stage did not run"; exit 1; }
            done
          fi
